name: Release Please

# Su ogni push su main, release-please calcola il bump dai Conventional Commits
# dall'ultimo tag devflow-v* e apre/aggiorna una release PR.
# Al merge della release PR: crea tag annotato devflow-v* + GitHub Release.
#
# Conventional Commits → impatto versione:
#   feat:             MINOR bump (1.0.0 → 1.1.0)
#   fix:              PATCH bump (1.0.0 → 1.0.1)
#   feat!: / BREAKING CHANGE:  MAJOR bump
#   docs:, chore:, refactor:, test:  nessun bump

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Una PR aperta con GITHUB_TOKEN non avvia altri workflow: Build Verify
          # non girerebbe mai sulla release PR. RELEASE_PLEASE_TOKEN = PAT
          # (o token di una GitHub App) con contents + pull-requests write.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      # Nessun rebuild post-release: extra-files aggiorna già ogni manifest
      # generato in dist/, e Build Verify controlla il sync sulla release PR.
